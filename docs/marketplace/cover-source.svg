<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title description">
  <title id="title">Movie Importer</title>
  <desc id="description">Movie Importer logotype with a film-frame import mark on a dark blue background.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111b2b"/>
      <stop offset="1" stop-color="#080e18"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#78b7ff"/>
      <stop offset="1" stop-color="#3478d4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#02060d" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#background)"/>
  <circle cx="1035" cy="-40" r="330" fill="#1d3556" opacity="0.22"/>
  <circle cx="1130" cy="60" r="205" fill="#376cae" opacity="0.09"/>

  <g transform="translate(118 250)" filter="url(#shadow)">
    <rect width="300" height="300" rx="68" fill="url(#mark)"/>
    <rect x="62" y="78" width="176" height="144" rx="24" fill="none" stroke="#ffffff" stroke-width="14"/>
    <rect x="78" y="96" width="12" height="18" rx="4" fill="#ffffff"/>
    <rect x="78" y="141" width="12" height="18" rx="4" fill="#ffffff"/>
    <rect x="78" y="186" width="12" height="18" rx="4" fill="#ffffff"/>
    <rect x="210" y="96" width="12" height="18" rx="4" fill="#ffffff"/>
    <rect x="210" y="141" width="12" height="18" rx="4" fill="#ffffff"/>
    <rect x="210" y="186" width="12" height="18" rx="4" fill="#ffffff"/>
    <path d="M150 98v72m-34-34 34 34 34-34" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(478 284)">
    <text x="0" y="86" fill="#ffffff" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="98" font-weight="760" letter-spacing="-4">Movie</text>
    <text x="0" y="190" fill="#78b7ff" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="98" font-weight="760" letter-spacing="-4">Importer</text>
  </g>
</svg>
