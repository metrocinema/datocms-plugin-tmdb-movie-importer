name: Validate package

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    name: Build and verify package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run verify:package
      - run: npm pack --dry-run --json --ignore-scripts
